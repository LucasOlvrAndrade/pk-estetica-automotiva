<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 72" role="img" aria-labelledby="t">
  <title id="t">Monograma PK da PK Estética Automotiva</title>
  <!-- Monograma "PK" cromado: letras retas e chanfradas, inclinadas 12° (ângulo de corrida).
       Um único contorno (P com o "furo" e K inteiro): bordas lisas e o cromo contínuo nas duas letras.
       Feito só com formas: não depende de fonte. -->
  <defs>
    <linearGradient id="cromo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.3" stop-color="#d9dce1" />
      <stop offset="0.48" stop-color="#8a9099" />
      <stop offset="0.56" stop-color="#f4f5f7" />
      <stop offset="0.78" stop-color="#a9aeb6" />
      <stop offset="1" stop-color="#e8eaee" />
    </linearGradient>
  </defs>
  <g fill="url(#cromo)">
    <g transform="translate(14 0) skewX(-12)">
      <path fill-rule="evenodd" d="M8 8H46L56 18V32L46 42H21V64H8ZM21 19V31H40L43 28V22L40 19ZM62 8H75V30L96 8H112L87.2 34.7L112 64H96L75 43V64H62Z" />
    </g>
  </g>
</svg>
